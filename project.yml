name: ChartAgent
options:
  bundleIdPrefix: ai.chartagent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  BorderBeamKit:
    path: Vendor/BorderBeamKit
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.80.0
  Airbridge:
    url: https://github.com/ab180/airbridge-ios-sdk-deployment
    from: 4.11.0
  Facebook:
    url: https://github.com/facebook/facebook-ios-sdk.git
    from: 18.1.0
  TikTokBusinessSDK:
    url: https://github.com/tiktok/tiktok-business-ios-sdk.git
    from: 1.7.1
settings:
  base:
    SWIFT_VERSION: 5.9
    DEVELOPMENT_TEAM: ""
targets:
  ChartAgent:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.InAppPurchase:
          enabled: 1
    configFiles:
      Debug: ChartAgent/Config/Secrets.xcconfig
      Release: ChartAgent/Config/Secrets.xcconfig
    sources:
      - path: ChartAgent
        excludes:
          - Config
    dependencies:
      - package: BorderBeamKit
        product: BorderBeamKit
      - package: RevenueCat
        product: RevenueCat
      - package: Airbridge
        product: Airbridge
      - package: Facebook
        product: FacebookCore
      - package: TikTokBusinessSDK
        product: TikTokBusinessSDK
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: U9QTM9L965
        PRODUCT_BUNDLE_IDENTIFIER: ai.chartagent.ios
        PRODUCT_NAME: ChartAgent
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 5
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ChartAgent/Config/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
  ChartAgentTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChartAgentTests
    dependencies:
      - target: ChartAgent
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ChartAgent:
    build:
      targets:
        ChartAgent: all
    run:
      config: Debug
    test:
      targets:
        - ChartAgentTests
