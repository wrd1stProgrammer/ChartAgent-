services:
  chartagent-api:
    image: ${CHARTAGENT_IMAGE:-wrd1stprogrammer/chartagent:latest}
    container_name: chartagent-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8010:8010"
    volumes:
      - shared-codex-home:/home/app/.codex
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  shared-codex-home:
    external: true
    name: ${SHARED_CODEX_VOLUME:-facemaxx_codex-home}
